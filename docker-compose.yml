# Local PostgreSQL for development (used by ./run.sh and .\run.ps1), plus optional containerised
# app + monitor services. Credentials come from .env (created by the launcher on first run).
#
#   ./run.sh                                   # normal local use: starts only the `db` service
#   docker compose up -d db                    # database only
#   docker compose --profile full up --build   # full stack in containers (app on :3000)
#
# The named volume `pgdata` persists across restarts. Never use `docker compose down -v` unless you
# intend to DELETE the local database.
name: sdp26265 # fixed project name so the volume is found regardless of the checkout folder name

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${SDP_DB_USER:-sdp}
      POSTGRES_PASSWORD: ${SDP_DB_PASSWORD:?SDP_DB_PASSWORD is not set - run ./run.sh (or .\run.ps1) once to create .env}
      POSTGRES_DB: ${SDP_DB_NAME:-sdp_dev}
    ports:
      - "127.0.0.1:${SDP_DB_PORT:-5433}:5432" # localhost only; never published publicly
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\" -h 127.0.0.1"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  app:
    build: .
    depends_on: { db: { condition: service_healthy } }
    ports: ["127.0.0.1:3000:3000"]
    environment:
      DATABASE_URL: postgresql://${SDP_DB_USER:-sdp}:${SDP_DB_PASSWORD}@db:5432/${SDP_DB_NAME:-sdp_dev}?schema=public
      APP_URL: http://localhost:3000
      DEMO_MODE: "true"
      DEMO_PASSWORD: ${DEMO_PASSWORD:-Demo@SDP2026}
      SECURE_COOKIES: "false" # plain HTTP on localhost only
      VERIFICATION_PROVIDER: demo
    volumes: ["documents:/var/data"]
    profiles: ["full"]

  monitor:
    build: .
    depends_on: { db: { condition: service_healthy } }
    command: ["npm", "run", "monitor:watch"]
    environment:
      DATABASE_URL: postgresql://${SDP_DB_USER:-sdp}:${SDP_DB_PASSWORD}@db:5432/${SDP_DB_NAME:-sdp_dev}?schema=public
      MONITOR_INTERVAL_MINUTES: "60"
    profiles: ["full"]

volumes:
  pgdata:
  documents:
