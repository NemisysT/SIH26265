# Local stack: PostgreSQL + portal + hourly monitor loop. Demonstration settings only.
#   docker compose up --build
#   docker compose exec app npm run db:seed     # load synthetic demo data
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: sdp
      POSTGRES_PASSWORD: sdp_local_dev
      POSTGRES_DB: sdp_dev
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sdp -d sdp_dev"]
      interval: 5s
      retries: 10

  app:
    build: .
    depends_on: { db: { condition: service_healthy } }
    ports: ["3000:3000"]
    environment:
      DATABASE_URL: postgresql://sdp:sdp_local_dev@db:5432/sdp_dev?schema=public
      APP_URL: http://localhost:3000
      DEMO_MODE: "true"
      DEMO_PASSWORD: ${DEMO_PASSWORD:-Demo@SDP2026}
      SECURE_COOKIES: "false" # plain HTTP on localhost only
      VERIFICATION_PROVIDER: demo
    volumes: ["documents:/var/data"]

  monitor:
    build: .
    depends_on: { db: { condition: service_healthy } }
    command: ["npm", "run", "monitor:watch"]
    environment:
      DATABASE_URL: postgresql://sdp:sdp_local_dev@db:5432/sdp_dev?schema=public
      MONITOR_INTERVAL_MINUTES: "60"

volumes:
  pgdata:
  documents:
